name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --generate-notes --verify-tag

      - name: Move floating major tag
        run: |
          TAG="${{ github.ref_name }}"
          MAJOR="${TAG%%.*}"
          git tag -f "$MAJOR" "${{ github.sha }}"
          git push origin "$MAJOR" --force
