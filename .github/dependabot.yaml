version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
    groups:
      # `applies-to` defaults to version-updates. Without an explicit
      # security-updates group, every advisory opens its own PR.
      actions-minor-patch:
        applies-to: version-updates
        patterns: ['*']
        update-types: ['minor', 'patch']
      actions-major:
        applies-to: version-updates
        patterns: ['*']
        update-types: ['major']
      actions-security:
        applies-to: security-updates
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
    groups:
      npm-minor-patch:
        applies-to: version-updates
        patterns: ['*']
        update-types: ['minor', 'patch']
      npm-major:
        applies-to: version-updates
        patterns: ['*']
        update-types: ['major']
      npm-security:
        applies-to: security-updates
        patterns: ['*']
