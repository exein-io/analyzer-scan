name: Bug report
description: Report a problem with the Exein Analyzer Scan action
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report.

        **Do not report security vulnerabilities here.** Please follow the
        [security policy](https://github.com/exein-io/analyzer-scan/security/policy) instead.

        ⚠️ **Redact any secrets** (such as your `api-key`) from workflow snippets and logs before posting.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: input
    id: action-version
    attributes:
      label: Action version / ref
      description: Which version or ref of `exein-io/analyzer-scan` did you use (e.g. `@v0`, `@v0.2.0`, a commit SHA)?
      placeholder: "e.g. exein-io/analyzer-scan@v0"
    validations:
      required: true
  - type: dropdown
    id: scan-type
    attributes:
      label: Scan type
      description: The `scan-type` input in use.
      options:
        - docker
        - linux
        - idf
        - sbom
        - "not applicable / unknown"
    validations:
      required: true
  - type: input
    id: api-url
    attributes:
      label: API URL
      description: The `api-url` input. Leave as the default unless you use an on-prem/self-hosted deployment.
      placeholder: "https://analyzer.exein.io/api/"
    validations:
      required: false
  - type: textarea
    id: workflow
    attributes:
      label: Workflow snippet
      description: The relevant part of your workflow YAML that invokes the action. Remember to redact secrets.
      render: yaml
    validations:
      required: false
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste any relevant action run logs. Remember to redact secrets. This will be automatically formatted, so no backticks needed.
      render: shell
    validations:
      required: false
